name: Deploy to GitHub Pages

on:
  push:
    branches: [main, pilot-2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout pilot-2
        uses: actions/checkout@v4
        with:
          ref: pilot-2
          path: pilot-2

      - name: Assemble site
        run: |
          mkdir -p site/p2
          cp -r main/human main/ai site/
          cp -r pilot-2/human pilot-2/ai site/p2/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
